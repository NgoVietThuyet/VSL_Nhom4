<nz-drawer [nzWidth]="560" [nzClosable]="false" [nzVisible]="visible" nzPlacement="right" [nzExtra]="extra"
  [nzTitle]="isEdit ? 'CHỈNH SỬA BÀI HỌC' : 'TẠO MỚI BÀI HỌC'" (nzOnClose)="close()">
  <ng-container *nzDrawerContent>
    <div class="form-container">
      <label>Tên bài học <span class="required-star">*</span></label>
      <input nz-input [(ngModel)]="dto.title" placeholder="Bài 1: Chào hỏi cơ bản" class="space-control" />

      <label>Mô tả bài học</label>
      <textarea nz-input rows="3" [(ngModel)]="dto.description" placeholder="Nội dung chính của bài học..."
        class="space-control"></textarea>

      <label>Mục tiêu bài học</label>
      <textarea nz-input rows="3" [(ngModel)]="dto.objectives"
        placeholder="Sau bài học, học viên có thể chào hỏi, giới thiệu bản thân..." class="space-control"></textarea>

      <div class="flex-form">
        <div>
          <label>Độ khó</label>
          <nz-select [(ngModel)]="dto.difficulty" class="space-control">
            @for (d of difficulties; track d.value) {
            <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option>
            }
          </nz-select>
        </div>
        <div>
          <label>Trạng thái</label>
          <div class="space-control d-flex align-items-center" style="height: 32px;">
            <nz-switch [(ngModel)]="dto.isActive" nzSize="small" class="me-2"></nz-switch>
            <span>{{ dto.isActive ? 'Hiển thị cho học viên' : 'Tạm ẩn' }}</span>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</nz-drawer>

<ng-template #extra>
  <nz-space>
    <button *nzSpaceItem nz-button (click)="close()">
      <nz-icon nzType="close" />Huỷ
    </button>
    <button *nzSpaceItem nz-button nzType="primary" [nzLoading]="saving" (click)="save()">
      <nz-icon nzType="save" />Lưu
    </button>
  </nz-space>
</ng-template>

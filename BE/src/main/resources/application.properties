spring:
  application:
    name: smr-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://sso.d2s.com.vn:2025;databaseName=VSL;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa@d2s.com.vn}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
      use_nationalized_character_daata: true

server:
  port: ${SERVER_PORT:5228}

smr:
  auth:
    public-registration: ${PUBLIC_REGISTRATION:false}
    registration-org-id: ${REGISTRATION_ORG_ID:}
    registration-title-code: ${REGISTRATION_TITLE_CODE:}
    expose-reset-token: ${EXPOSE_RESET_TOKEN:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
  minio:
    endpoint: ${MINIO_ENDPOINT:minio.d2s.vn}
    port: ${MINIO_PORT:443}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123}
    use-ssl: ${MINIO_USE_SSL:true}
    bucket-name: ${MINIO_BUCKET:vsl}

<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>OnlyOffice Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      height: 100dvh;
      overflow: hidden;
    }

    #placeholder {
      width: 100%;
      height: 100%;
    }

    #logo {
      position: fixed;
      top: 0;
      left: 0;
      background: #F7F7F7;
      padding: 8px 8px 0px 8px;
      display: none;
      z-index: 9999;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F7F7F7;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }

    #loading-overlay img {
      width: 240px;
    }
  </style>
</head>

<body>
  <div id="loading-overlay">
    <img src="../img/d2s_logo.png" alt="Loading...">
  </div>

  <div id="placeholder"></div>
  <div id="logo"><img src="../img/d2s_logo.png" style="width: 84px;"></div>

  <script>
    let editor = null;

    const getFileType = (name) => {
      const ext = name.split('.').pop().toLowerCase();
      const types = {
        word: ['doc', 'docx', 'pdf', 'txt', 'rtf'],
        cell: ['xls', 'xlsx', 'csv'],
        slide: ['ppt', 'pptx']
      };
      return Object.keys(types).find(k => types[k].includes(ext)) || 'word';
    };

    function formatDateKey(dateInput) {
        const d = new Date(dateInput);

        const pad = (n) => n.toString().padStart(2, '0');

        const day = pad(d.getDate());
        const month = pad(d.getMonth() + 1);
        const year = d.getFullYear();

        const hours = pad(d.getHours());
        const minutes = pad(d.getMinutes());
        const seconds = pad(d.getSeconds());

        return `${day}_${month}_${year}_${hours}_${minutes}_${seconds}`;
      }

    function loadScript(url, callback) {
      if (window.DocsAPI) {
        callback && callback();
        return;
      }

      const s = document.createElement('script');
      s.src = `${url}/web-apps/apps/api/documents/api.js?t=${Date.now()}`;
      s.onload = () => callback && callback();
      s.onerror = (err) => console.error('Không tải được script:', err);
      document.head.appendChild(s);
    }

    window.addEventListener('message', async (e) => {
      const { file, mode, environment, onlyOfficeUrl, account, documentUrl } = e.data;
      if (!file) return;

      const docUrl = documentUrl
        || `${environment}/File/Download/${file.id}`;
      const docKeySuffix = file.modifiedDate ? formatDateKey(file.modifiedDate) : Date.now();

      try {
        loadScript(onlyOfficeUrl, function () {

          if (editor) editor.destroyEditor();

          editor = new DocsAPI.DocEditor('placeholder', {
            width: "100%",
            height: "100%",
            documentType: getFileType(file.fileName || file.name),
            document: {
              fileType: (file.fileName || file.name).split('.').pop(),
              key: `${file.id}_${docKeySuffix}`,
              title: (file.fileName || file.name),
              url: docUrl
            },
            editorConfig: {
              mode: mode || 'view',
              lang: 'en',
              callbackUrl: mode === 'edit' ? `${environment}/OnlyOffice/CallbackOnlyOfficeExplorer?fileId=${file.id}` : '',
              user: { id: account?.userName, name: account?.fullName },
              customization: {
                compactToolbar: false,
                toolbarNoTabs: false,
                statusBar: true,
                autosave: true,
                forcesave: true,
                comments: false,
                showReviewChanges: false,
                spellcheck: false,
                hideRightMenu: true,
                hideLeftMenu: true,
                hideToolbar: false,
                uiTheme: "theme-gray",
              },
              theme: {
                type: "gray"
              }
            },
            events: {
              onAppReady: function () {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                  overlay.style.display = 'none';
                }
                document.getElementById('logo').style.display = 'block';
              },
              onError: function (event) {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                  overlay.style.display = 'none';
                }
                document.getElementById('logo').style.display = 'block';
              }
            }
          });
        });

      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>

</html>

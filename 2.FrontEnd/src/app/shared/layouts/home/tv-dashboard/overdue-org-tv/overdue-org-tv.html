<ng-template #tvEmptyTpl></ng-template>

<div class="tv-shell">
  <div class="tv-card">
    <div class="tv-card__header">
      <a routerLink="/home" class="tv-back-btn" title="Quay lại trang chủ">
        <i class="bi bi-arrow-left"></i>
        Quay lại
      </a>
      <div class="tv-card__header-main">
        <div class="tv-card__icon">
          <i class="bi bi-building-exclamation"></i>
        </div>
        <div>
          <p class="tv-card__title">Danh sách đơn vị chậm muộn</p>
          <p class="tv-card__sub">Hệ thống quản lý nhiệm vụ</p>
        </div>
      </div>
      <div class="tv-clock">
        <div class="tv-clock__time">{{ currentTime }}</div>
        <div class="tv-clock__date">{{ currentDate }}</div>
      </div>
    </div>

    <div class="tv-stats">
      <span class="tv-stats__label">Đơn vị quá hạn / Tổng đơn vị</span>
      <span class="tv-stats__value">{{ overdueCount }} / {{ data.length }}</span>
    </div>

    <div class="tv-card__body">
      <div class="tv-table-wrap" #scrollBody *ngIf="data.length">
        <table class="tv-table">
          <thead>
            <tr>
              <th class="col-stt text-center">STT</th>
              <th class="col-org">Tên đơn vị</th>
              <!-- <th class="col-stat text-center">Trong hạn</th>
              <th class="col-stat text-center">Quá hạn</th>
              <th class="col-stat text-center">Sắp đến hạn</th> -->
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of data; let i = index">
              <td class="text-center">{{ i + 1 }}</td>
              <td class="fw-600" [style.color]="getOverdueOrgColor(i)">{{ item.orgName }}</td>
              <!-- <td class="text-center">
                <span class="tv-badge tv-badge--on-time">{{ item.onTime ?? 0 }}/{{ item.total ?? 0 }}</span>
              </td>
              <td class="text-center">
                <span class="tv-badge tv-badge--overdue">{{ item.overdue ?? 0 }}/{{ item.total ?? 0 }}</span>
              </td>
              <td class="text-center">
                <span class="tv-badge tv-badge--due-soon">{{ item.dueSoon ?? 0 }}/{{ item.total ?? 0 }}</span>
              </td> -->
            </tr>
          </tbody>
        </table>
      </div>
      <nz-empty *ngIf="!data.length"
                class="tv-empty"
                [nzNotFoundContent]="tvEmptyTpl"></nz-empty>
    </div>

    <div class="tv-footer">
      <span class="tv-footer__updated">
        <i class="bi bi-arrow-clockwise"></i>
        Cập nhật lúc: <strong>{{ lastUpdated || '—' }}</strong>
      </span>
      <span class="tv-footer__realtime">
        <i class="bi bi-broadcast"></i>
        Cập nhật realtime
      </span>
      <button type="button" class="tv-fs-btn" (click)="toggleFullscreen()"
              [title]="isFullscreen ? 'Thoát toàn màn hình' : 'Toàn màn hình'">
        <i [class]="isFullscreen ? 'bi bi-fullscreen-exit' : 'bi bi-fullscreen'"></i>
      </button>
    </div>
  </div>
</div>

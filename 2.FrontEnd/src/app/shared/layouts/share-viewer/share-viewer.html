<!DOCTYPE html>
<html>
<body>
  <div class="share-viewer-page">

    <!-- Error State -->
    <div *ngIf="isError" class="state-container">
      <nz-result
        nzStatus="404"
        nzTitle="Liên kết không khả dụng"
        [nzSubTitle]="errorMessage">
        <ng-container nzExtra>
          <div class="error-detail">
            <i nz-icon nzType="link" style="font-size: 48px; color: #d9d9d9; margin-bottom: 16px; display: block;"></i>
            <p style="color: #8c8c8c; font-size: 13px;">
              Liên kết chia sẻ này có thể đã hết hạn, bị xóa, hoặc bạn không có quyền truy cập.
            </p>
          </div>
        </ng-container>
      </nz-result>
    </div>

    <!-- OnlyOffice Viewer -->
    <div *ngIf="!isError && filePreviewUrl" class="viewer-container">
      <iframe
        [id]="idTabActive"
        [src]="filePreviewUrl"
        class="office-frame">
      </iframe>
    </div>

  </div>
</body>
</html>

@if (isLoading) {
  <div class="hangfire-state">
    <div class="hangfire-spinner"></div>
    <span>Đang kiểm tra phiên đăng nhập...</span>
  </div>
}

@if (!isLoading && !isTokenValid) {
  <div class="hangfire-state hangfire-unauthorized">
    <span class="hangfire-icon">🔒</span>
    <p>Phiên đăng nhập hết hạn.</p>
    <small>Đang chuyển hướng đến trang đăng nhập...</small>
  </div>
}

@if (!isLoading && isTokenValid) {
  <iframe [src]="hangfireUrl" class="hangfire"></iframe>
}

<div class="waiting-room-container">
  <div class="waiting-card">

    <!-- Header -->
    <div class="waiting-header">
      <i class="bi bi-camera-video waiting-icon"></i>
      <h2 class="meeting-title">{{ meetingName || 'Cuộc họp' }}</h2>
      <p class="meeting-id-text">Mã cuộc họp: <strong>{{ meetingId }}</strong></p>
    </div>

    <!-- Waiting state -->
    <div *ngIf="isWaiting" class="waiting-body">
      <div class="spinner-wrapper">
        <nz-spin nzSimple [nzSize]="'large'"></nz-spin>
      </div>
      <p class="waiting-title">Đang chờ chủ trì phê duyệt...</p>
      <p class="waiting-subtitle">
        Vui lòng chờ. Chủ trì sẽ sớm chấp nhận hoặc từ chối yêu cầu tham gia của bạn.
      </p>
      <div class="user-info-badge">
        <i class="bi bi-person-circle"></i>
        <span>{{ accountInfo?.fullName || accountInfo?.FullName || accountInfo?.userName || 'Người dùng' }}</span>
      </div>
    </div>

    <!-- Approved state -->
    <div *ngIf="!isWaiting" class="waiting-body">
      <div class="status-icon approved">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <p class="waiting-title">Đang vào cuộc họp...</p>
    </div>

    <!-- Footer actions -->
    <div class="waiting-footer" *ngIf="isWaiting">
      <button nz-button nzType="default" nzDanger (click)="backToHome()">
        <i class="bi bi-x-lg"></i> Hủy
      </button>
    </div>

  </div>
</div>

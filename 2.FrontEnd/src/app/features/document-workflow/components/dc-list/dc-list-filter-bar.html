<div class="dc-filter-control">
  <nz-select *ngIf="showPhanLoaiFilter" class="dc-filter-field dc-filter-field--md"
    nzShowSearch nzAllowClear nzPlaceHolder="Phân loại VB"
    [(ngModel)]="filter.filterPhanLoai" (ngModelChange)="search.emit()">
    <nz-option *ngFor="let o of phanLoaiOptions" [nzValue]="o.value" [nzLabel]="o.label"></nz-option>
  </nz-select>

  <nz-select class="dc-filter-field dc-filter-field--sm" nzShowSearch nzAllowClear
    nzPlaceHolder="Mật/thường" [(ngModel)]="filter.securityLevelId" (ngModelChange)="search.emit()">
    <nz-option *ngFor="let s of securityLevels" [nzValue]="s.code" [nzLabel]="s.name"></nz-option>
  </nz-select>

  <nz-select class="dc-filter-field dc-filter-field--sm" nzShowSearch nzAllowClear
    nzPlaceHolder="Lĩnh vực" [(ngModel)]="filter.fieldId" (ngModelChange)="search.emit()">
    <nz-option *ngFor="let f of documentFields" [nzValue]="f.code" [nzLabel]="f.name"></nz-option>
  </nz-select>

  <nz-input-group class="dc-filter-field dc-filter-field--grow" [nzSuffix]="suffixIconSearch">
    <input nz-input [placeholder]="keywordPlaceholder" [(ngModel)]="filter.keyWord"
      (keydown.enter)="search.emit()" />
  </nz-input-group>
  <ng-template #suffixIconSearch>
    <nz-icon nzType="search" nzTheme="outline" style="cursor:pointer" (click)="search.emit()"></nz-icon>
  </ng-template>
</div>

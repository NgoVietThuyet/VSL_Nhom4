<div class="dc-file-preview-host">
  @switch (viewMode) {
    @case ('loading') {
      <div class="dc-file-preview-loading">
        <nz-spin nzSimple nzSize="large"></nz-spin>
        <span>Đang tải xem trước...</span>
      </div>
    }
    @case ('pdf') {
      <iframe [src]="iframeUrl" class="dc-file-preview-frame" frameborder="0" allowfullscreen></iframe>
    }
    @case ('onlyoffice') {
      <iframe
        [id]="onlyOfficeTabId"
        [src]="iframeUrl"
        class="dc-file-preview-frame"
        frameborder="0"
        allowfullscreen></iframe>
    }
    @case ('image') {
      <div class="dc-file-preview-media">
        <img [src]="mediaUrl" [alt]="fileName" class="dc-file-preview-image" />
      </div>
    }
    @case ('video') {
      <div class="dc-file-preview-media">
        <video [src]="mediaUrl" controls class="dc-file-preview-video"></video>
      </div>
    }
    @case ('unsupported') {
      <div class="dc-file-preview-unsupported">
        <nz-icon nzType="file-exclamation" nzTheme="outline" />
        <p>Định dạng tệp chưa hỗ trợ xem trước.</p>
        <button nz-button nzType="primary" type="button" (click)="downloadFile()">
          <nz-icon nzType="download" nzTheme="outline" /> Tải xuống
        </button>
      </div>
    }
  }
</div>

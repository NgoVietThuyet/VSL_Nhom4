<div class="dc-plan-tree">
  <div class="dc-plan-tree-toolbar">
  <div class="dc-plan-phan-loai" *ngIf="showPhanLoaiTags">
    <button *ngFor="let p of phanLoaiOptions; trackBy: trackById"
      nz-button nzType="dashed" class="tag-filter"
      [class.selected]="phanLoai === p.value"
      (click)="selectPhanLoai(p.value)">
      {{ p.label }}
    </button>
  </div>

  <div class="filter-plan" *ngIf="!hideLeaderSelect && phanLoai != null">
    <nz-select nzShowSearch nzAllowClear class="lanh-dao-xu-ly-select"
      [ngModel]="deXuatLanhDaoXuLy"
      [nzPlaceHolder]="leaderPlaceholder"
      (ngModelChange)="onDeXuatLanhDaoChange($event)">
      <nz-option *ngFor="let i of leaderOptions; trackBy: trackById"
        [nzLabel]="i.fullName" [nzValue]="i.userName"></nz-option>
    </nz-select>
  </div>

  <nz-empty *ngIf="phanLoai != null && state.listOfMapData.length === 0"
    nzNotFoundContent="Không có dữ liệu cây phương án"></nz-empty>

  <nz-empty *ngIf="phanLoai == null"
    [nzNotFoundContent]="'Vui lòng chọn phân loại văn bản để lên cây phương án!'"></nz-empty>
  </div>

  <div class="dc-plan-tree-table-wrap" *ngIf="state.listOfMapData.length > 0">
    <div class="filter-plan">
      <nz-input-group [nzSuffix]="suffixIconSearch">
        <input type="text" nz-input placeholder="Tìm kiếm theo Cá nhân | Đơn vị"
          [(ngModel)]="state.filterPlan.searchText"
          (keydown.enter)="onSearchChange()" />
      </nz-input-group>
      <ng-template #suffixIconSearch><nz-icon nzType="search" /></ng-template>

      <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Tìm theo khối"
        [(ngModel)]="state.filterPlan.searchKhoi"
        (ngModelChange)="onSearchChange()">
        <nz-option *ngFor="let i of state.khoiDonVi; trackBy: trackById"
          [nzLabel]="i.name" [nzValue]="i.id"></nz-option>
      </nz-select>
    </div>

    <nz-table [nzData]="state.visibleRows" nzTableLayout="fixed" nzSize="small" nzBordered
      [nzFrontPagination]="false">
      <thead>
        <tr>
          <th nzWidth="32px" nzAlign="center"></th>
          <th>Cá nhân | Đơn vị</th>
          <th nzAlign="center" nzWidth="80px">Chủ trì</th>
          <th nzAlign="center" nzWidth="80px">Chỉ đạo<br />XLC</th>
          <th nzAlign="center" nzWidth="80px">Phối hợp</th>
          <th nzAlign="center" nzWidth="80px">Nhận để biết</th>
        </tr>
        <tr>
          <th></th><th></th><th></th>
          <th nzAlign="center">
            <input type="checkbox" class="custom-checkbox"
              [checked]="state.checkAllXuLyChinh"
              (change)="onCheckboxAll($any($event.target).checked, 'isXuLyChinh')" />
          </th>
          <th nzAlign="center">
            <input type="checkbox" class="custom-checkbox"
              [checked]="state.checkAllPhoiHop"
              (change)="onCheckboxAll($any($event.target).checked, 'isPhoiHop')" />
          </th>
          <th nzAlign="center">
            <input type="checkbox" class="custom-checkbox"
              [checked]="state.checkAllNhanDeBiet"
              (change)="onCheckboxAll($any($event.target).checked, 'isNhanDeBiet')" />
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of state.visibleRows; trackBy: trackRow">
          <td nzAlign="center">
            <nz-icon *ngIf="item.type === 'USER' || item.type === 'ORG'"
              [nzType]="item.type === 'USER' ? 'user' : 'home'"
              [style.color]="item.type === 'USER' ? '#378a00' : '#1890ff'" />
          </td>
          <td [style.color]="item.color" [nzIndentSize]="(item.level ?? 0) * 20"
            [nzShowExpand]="(item.children?.length ?? 0) > 0"
            [(nzExpand)]="item.expand"
            (nzExpandChange)="onExpand(item, $event)"
            class="no-wrap-text">
            {{ item.name }}
          </td>
          <td nzAlign="center">
            <input *ngIf="item.isShowCheckbox" type="checkbox" class="custom-checkbox"
              [checked]="!!item.isChuTri" [disabled]="!!item.isChuTriDisabled"
              (change)="onCheckbox(item, 'isChuTri', $any($event.target).checked)" />
          </td>
          <td nzAlign="center">
            <input *ngIf="item.isShowCheckbox" type="checkbox" class="custom-checkbox"
              [checked]="!!item.isXuLyChinh" [disabled]="!!item.isXuLyChinhDisabled"
              (change)="onCheckbox(item, 'isXuLyChinh', $any($event.target).checked)" />
          </td>
          <td nzAlign="center">
            <input *ngIf="item.isShowCheckbox" type="checkbox" class="custom-checkbox"
              [checked]="!!item.isPhoiHop" [disabled]="!!item.isPhoiHopDisabled"
              (change)="onCheckbox(item, 'isPhoiHop', $any($event.target).checked)" />
          </td>
          <td nzAlign="center">
            <input *ngIf="item.isShowCheckbox" type="checkbox" class="custom-checkbox"
              [checked]="!!item.isNhanDeBiet" [disabled]="!!item.isNhanDeBietDisabled"
              (change)="onCheckbox(item, 'isNhanDeBiet', $any($event.target).checked)" />
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</div>

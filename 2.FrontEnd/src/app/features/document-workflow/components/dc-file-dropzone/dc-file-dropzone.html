<div
  class="drop-zone"
  [class.drop-zone--disabled]="disabled && !loading"
  [class.drop-zone--loading]="loading"
  [class.drag-over]="isDragOver && !disabled && !loading"
  (click)="onZoneClick()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)">
  <input #fileInput type="file" hidden (change)="onFileInput($event)" />

  @if (loading) {
    <span nz-icon nzType="loading" nzTheme="outline" [nzSpin]="true" class="drop-zone-icon drop-zone-icon--loading"></span>
    <p class="drop-zone-text">{{ loadingText }}</p>
  } @else if (!disabled) {
    <span nz-icon nzType="cloud-upload" nzTheme="outline" class="drop-zone-icon"></span>
    <p class="drop-zone-text">{{ hintText }}</p>
  } @else {
    <span nz-icon nzType="file" nzTheme="outline" class="drop-zone-icon drop-zone-icon--muted"></span>
    <p class="drop-zone-text drop-zone-text--muted">{{ readonlyText }}</p>
  }
</div>

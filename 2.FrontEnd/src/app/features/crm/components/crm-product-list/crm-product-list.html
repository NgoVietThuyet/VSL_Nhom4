<nz-page-header nzTitle="CRM – Sản phẩm" nzSubtitle="Quản lý sản phẩm và dịch vụ" [nzGhost]="false"></nz-page-header>

<div class="crm-page-content">
  <nz-card class="filter-card" nzBordered>
    <form nz-form [formGroup]="filterForm" (ngSubmit)="search()">
      <nz-row [nzGutter]="16">
        <nz-col nzSpan="24" nzSm="12" nzMd="8" nzLg="6">
          <nz-form-item>
            <nz-form-label nzFor="keyWord">Tìm kiếm</nz-form-label>
            <nz-form-control>
              <input nz-input id="keyWord" formControlName="keyWord" placeholder="Mã, tên sản phẩm" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>
        <nz-col nzSpan="24" nzSm="12" nzMd="8" nzLg="6">
          <nz-form-item>
            <nz-form-label nzFor="isService">Loại</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="isService" id="isService" nzAllowClear nzPlaceHolder="Tất cả loại">
                <nz-option [nzValue]="false" nzLabel="Hàng hóa"></nz-option>
                <nz-option [nzValue]="true" nzLabel="Dịch vụ"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>
      </nz-row>
      <div class="filter-actions">
        <button nz-button nzType="primary" [disabled]="loading" type="submit">Tìm kiếm</button>
        <button nz-button nzType="default" (click)="resetFilters()" type="button">Đặt lại</button>
      </div>
    </form>
  </nz-card>

  <div class="list-toolbar">
    <button nz-button nzType="default" (click)="search(currentPage)" [disabled]="loading">Làm mới</button>
    <button nz-button nzType="primary" (click)="openCreate()">Thêm sản phẩm</button>
  </div>

  <nz-card class="table-container" nzBordered>
    <nz-spin [nzSpinning]="loading">
      <nz-table [nzData]="products" [nzLoading]="loading" nzBordered>
        <thead>
          <tr>
            <th>Mã</th>
            <th>Tên sản phẩm</th>
            <th>Đơn giá</th>
            <th>Đơn vị tính</th>
            <th>Loại</th>
            <th class="action-column">Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of products">
            <td>{{ p.code }}</td>
            <td>{{ p.name }}</td>
            <td>{{ formatCurrency(p.unitPrice) }}</td>
            <td>{{ p.unitOfMeasure }}</td>
            <td>
              <nz-tag [nzColor]="p.isService ? 'purple' : 'blue'">
                {{ p.isService ? 'Dịch vụ' : 'Hàng hóa' }}
              </nz-tag>
            </td>
            <td>
              <button nz-button nzType="default" nzSize="small" (click)="openEdit(p)">Sửa</button>
              <button nz-button nzType="primary" nzSize="small" nzDanger
                nz-popconfirm nzPopconfirmTitle="Bạn có chắc muốn xóa sản phẩm này?"
                (nzOnConfirm)="deleteProduct(p)">Xóa</button>
            </td>
          </tr>
        </tbody>
      </nz-table>
      <div class="list-empty" *ngIf="!loading && products.length === 0">
        <nz-empty nzNotFoundImage="default" nzDescription="Không có sản phẩm phù hợp"></nz-empty>
      </div>
    </nz-spin>
    <div class="pagination-wrapper" *ngIf="products.length > 0 || loading">
      <nz-pagination
        [nzPageIndex]="currentPage"
        [nzTotal]="total"
        [nzPageSize]="pageSize"
        [nzPageSizeOptions]="[10, 20, 50]"
        nzShowSizeChanger
        (nzPageIndexChange)="pageIndexChange($event)"
        (nzPageSizeChange)="pageSizeChange($event)">
      </nz-pagination>
    </div>
  </nz-card>
</div>

<ng-template #drawerExtra>
  <button nz-button nzType="primary" [nzLoading]="drawerLoading" (click)="submitForm()">
    {{ drawerMode === 'edit' ? 'Cập nhật' : 'Tạo mới' }}
  </button>
</ng-template>

<nz-drawer
  [nzVisible]="drawerVisible"
  [nzTitle]="drawerTitle"
  nzPlacement="right"
  [nzWidth]="drawerWidth"
  [nzMaskClosable]="false"
  (nzOnClose)="closeDrawer()"
  [nzExtra]="drawerExtra">
  <ng-container *nzDrawerContent>
    <nz-spin [nzSpinning]="drawerLoading">
      <form nz-form [formGroup]="productForm" (ngSubmit)="submitForm()" nzLayout="vertical">
        <nz-row [nzGutter]="16">
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>Mã sản phẩm</nz-form-label>
              <nz-form-control nzErrorTip="Vui lòng nhập mã">
                <input nz-input formControlName="code" placeholder="Mã sản phẩm" />
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzRequired>Tên sản phẩm</nz-form-label>
              <nz-form-control nzErrorTip="Vui lòng nhập tên">
                <input nz-input formControlName="name" placeholder="Tên sản phẩm" />
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="24">
            <nz-form-item>
              <nz-form-label>Mô tả</nz-form-label>
              <nz-form-control>
                <textarea nz-input formControlName="description" [nzAutosize]="{ minRows: 3, maxRows: 5 }" placeholder="Mô tả sản phẩm"></textarea>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label>Đơn giá</nz-form-label>
              <nz-form-control>
                <nz-input-number formControlName="unitPrice" [nzMin]="0" style="width:100%" placeholder="0"></nz-input-number>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label>Đơn vị tính</nz-form-label>
              <nz-form-control>
                <input nz-input formControlName="unitOfMeasure" placeholder="cái, bộ, tháng..." />
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="24">
            <nz-form-item>
              <nz-form-control>
                <label nz-checkbox formControlName="isService">Là dịch vụ (không phải hàng hóa)</label>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
        </nz-row>
      </form>
    </nz-spin>
  </ng-container>
</nz-drawer>

<div class="ccf-form">
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">

    <!-- ── Section 1: Thông tin cơ bản ── -->
    <div class="ccf-section-label">Thông tin cơ bản</div>
    <nz-row [nzGutter]="[16, 0]">
      <nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzFor="code" nzRequired>Mã chiến dịch</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập mã chiến dịch">
            <input nz-input id="code" formControlName="code" placeholder="Nhập mã chiến dịch" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzSpan="10">
        <nz-form-item>
          <nz-form-label nzFor="name" nzRequired>Tên chiến dịch</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập tên chiến dịch">
            <input nz-input id="name" formControlName="name" placeholder="Nhập tên chiến dịch" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzSpan="6">
        <nz-form-item>
          <nz-form-label nzFor="status">Trạng thái</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="status" id="status" nzPlaceHolder="Chọn trạng thái">
              <nz-option *ngFor="let s of statusOptions" [nzValue]="s" [nzLabel]="s"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>

    <!-- ── Section 2: Thời gian & Ngân sách ── -->
    <nz-divider nzOrientation="left" nzText="Thời gian & Ngân sách" class="ccf-divider"></nz-divider>
    <nz-row [nzGutter]="[16, 0]">
      <nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzFor="startDate">Ngày bắt đầu</nz-form-label>
          <nz-form-control>
            <nz-date-picker formControlName="startDate" id="startDate" nzFormat="dd/MM/yyyy" class="ccf-full"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzFor="endDate">Ngày kết thúc</nz-form-label>
          <nz-form-control>
            <nz-date-picker formControlName="endDate" id="endDate" nzFormat="dd/MM/yyyy" class="ccf-full"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzFor="budget">Ngân sách (VND)</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="budget" id="budget" [nzMin]="0"
              [nzFormatter]="formatNumber" [nzParser]="parseNumber"
              nzPlaceHolder="0" class="ccf-full"></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>

    <!-- ── Section 3: Thông tin khác ── -->
    <nz-divider nzOrientation="left" nzText="Thông tin khác" class="ccf-divider"></nz-divider>
    <nz-row [nzGutter]="[16, 0]">
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label nzFor="ownerUser">Người phụ trách</nz-form-label>
          <nz-form-control>
            <input nz-input id="ownerUser" formControlName="ownerUser" placeholder="Nhập người phụ trách" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label nzFor="description">Mô tả</nz-form-label>
          <nz-form-control>
            <textarea nz-input id="description" formControlName="description"
              [nzAutosize]="{ minRows: 3, maxRows: 6 }" placeholder="Nhập mô tả chiến dịch"></textarea>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>

  </form>
</div>

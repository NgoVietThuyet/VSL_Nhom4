<nz-page-header nzBackIcon>
    <nz-page-header-title>TÀI SẢN CỦA TÔI</nz-page-header-title>
    <nz-page-header-subtitle>Danh sách tài sản đang được giao</nz-page-header-subtitle>
    <nz-page-header-extra>
        <nz-space>
            <input *nzSpaceItem nz-input placeholder="Tìm kiếm" [(ngModel)]="filter.keyWord" (keydown)="onKeydownSearch($event)" />
            <button *nzSpaceItem nz-button (click)="search()"><nz-icon nzType="search" /></button>
        </nz-space>
    </nz-page-header-extra>
    <nz-page-header-content>
        <nz-table #list nzBordered [nzData]="data.data" nzSize="small" [nzFrontPagination]="false">
            <thead>
                <tr>
                    <th nzAlign="center" nzWidth="60px">STT</th>
                    <th nzWidth="140px">Mã</th>
                    <th>Tên</th>
                    <th nzWidth="140px">Loại</th>
                    <th nzWidth="140px">Vị trí</th>
                    <th nzWidth="120px">Tình trạng</th>
                    <th nzWidth="120px">Trạng thái</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of list.data; let i = index; trackBy: trackById">
                    <td nzAlign="center">{{i + 1}}</td>
                    <td>{{ item.code }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.categoryName }}</td>
                    <td>{{ item.location }}</td>
                    <td>{{ item.condition }}</td>
                    <td><nz-tag nzColor="blue">{{ item.status }}</nz-tag></td>
                </tr>
            </tbody>
        </nz-table>
    </nz-page-header-content>
</nz-page-header>
<div class="paging-container">
    <div>Tổng {{data.totalRecord}} bản ghi</div>
    <nz-pagination [nzPageIndex]="data.currentPage" [nzTotal]="data.totalRecord" nzShowSizeChanger [nzPageSize]="data.pageSize" (nzPageIndexChange)="pageIndexChange($event)" (nzPageSizeChange)="pageSizeChange($event)"></nz-pagination>
</div>

<nz-page-header nzBackIcon>
    <nz-page-header-title>ĐIỀU CHUYỂN TÀI SẢN</nz-page-header-title>
    <nz-page-header-extra>
        <nz-space>
            <nz-select *nzSpaceItem [(ngModel)]="filter.status" nzAllowClear nzPlaceHolder="Trạng thái" style="width:160px">
                <nz-option *ngFor="let s of statuses" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
            </nz-select>
            <input *nzSpaceItem nz-input placeholder="Tìm kiếm" [(ngModel)]="filter.keyWord" (keydown)="onKeydownSearch($event)" />
            <button *nzSpaceItem nz-button (click)="reset()"><nz-icon nzType="sync" /></button>
            <button *nzSpaceItem nz-button (click)="search()"><nz-icon nzType="search" /></button>
            <button *nzSpaceItem nz-button nzType="primary" (click)="open()"><nz-icon nzType="plus" />Tạo phiếu</button>
        </nz-space>
    </nz-page-header-extra>
    <nz-page-header-content>
        <nz-table #list nzBordered [nzData]="data.data" nzSize="small" [nzFrontPagination]="false">
            <thead>
                <tr>
                    <th nzAlign="center" nzWidth="60px">STT</th>
                    <th nzWidth="160px">Mã</th>
                    <th nzWidth="140px">Tài sản</th>
                    <th>Tên</th>
                    <th nzWidth="120px">Từ</th>
                    <th nzWidth="120px">Đến</th>
                    <th nzWidth="120px">Ngày</th>
                    <th nzAlign="center" nzWidth="130px">Trạng thái</th>
                    <th nzAlign="center" nzWidth="140px"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of list.data; let i = index; trackBy: trackById">
                    <td nzAlign="center">{{i + 1}}</td>
                    <td>{{ item.code }}</td>
                    <td>{{ item.assetCode }}</td>
                    <td>{{ item.assetName }}</td>
                    <td>{{ item.fromUser }}</td>
                    <td>{{ item.toUser }}</td>
                    <td>{{ item.transferDate | date:'dd/MM/yyyy' }}</td>
                    <td nzAlign="center"><nz-tag [nzColor]="statusInfo(item.status).color">{{ statusInfo(item.status).label }}</nz-tag></td>
                    <td nzAlign="center">
                        <ng-container *ngIf="item.status === 'PENDING'">
                            <a (click)="approve(item)">Duyệt</a>
                            <nz-divider nzType="vertical"></nz-divider>
                            <a (click)="reject(item)">Từ chối</a>
                        </ng-container>
                    </td>
                </tr>
            </tbody>
        </nz-table>
    </nz-page-header-content>
</nz-page-header>
<div class="paging-container">
    <div>Tổng {{data.totalRecord}} bản ghi</div>
    <nz-pagination [nzPageIndex]="data.currentPage" [nzTotal]="data.totalRecord" nzShowSizeChanger [nzPageSize]="data.pageSize" (nzPageIndexChange)="pageIndexChange($event)" (nzPageSizeChange)="pageSizeChange($event)"></nz-pagination>
</div>

<nz-drawer [nzWidth]="500" [nzVisible]="visible" nzPlacement="right" [nzTitle]="'TẠO PHIẾU ĐIỀU CHUYỂN'" [nzExtra]="extra" (nzOnClose)="close()">
    <ng-container *nzDrawerContent>
        <label>Tài sản</label>
        <nz-select [(ngModel)]="dto.assetId" nzShowSearch class="space-control" style="width:100%">
            <nz-option *ngFor="let a of assetOptions" [nzValue]="a.id" [nzLabel]="a.code + ' - ' + a.name"></nz-option>
        </nz-select>
        <label>Đến người dùng</label>
        <input nz-input [(ngModel)]="dto.toUser" class="space-control" />
        <label>Đến đơn vị</label>
        <input nz-input [(ngModel)]="dto.toOrg" class="space-control" />
        <label>Vị trí mới</label>
        <input nz-input [(ngModel)]="dto.toLocation" class="space-control" />
        <label>Ngày điều chuyển</label>
        <nz-date-picker [(ngModel)]="dto.transferDate" nzFormat="yyyy-MM-dd" class="space-control" style="width:100%"></nz-date-picker>
        <label>Lý do</label>
        <textarea nz-input [(ngModel)]="dto.reason" rows="2" class="space-control"></textarea>
        <label>Ghi chú</label>
        <textarea nz-input [(ngModel)]="dto.note" rows="2" class="space-control"></textarea>
    </ng-container>
    <ng-template #extra>
        <nz-space>
            <button *nzSpaceItem nz-button nzType="primary" (click)="save()"><nz-icon nzType="save" /> Lưu</button>
            <button *nzSpaceItem nz-button nzDanger (click)="close()"><nz-icon nzType="close" /></button>
        </nz-space>
    </ng-template>
</nz-drawer>

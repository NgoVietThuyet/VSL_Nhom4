<div class="list-view">
  <!-- Section header toolbar -->
  <div class="list-toolbar">
    <div class="list-toolbar-left">
      <span class="list-toolbar-title">
        <i nz-icon nzType="bars"></i>
        Danh sách nhiệm vụ
      </span>
      <nz-tag class="task-count-badge">{{ getTotalCards() }} nhiệm vụ</nz-tag>
    </div>
    <div class="list-toolbar-right">
      <button nz-button nzType="text" nzSize="small" class="toolbar-btn" disabled>
        <i nz-icon nzType="filter"></i> Lọc
      </button>
      <button nz-button nzType="text" nzSize="small" class="toolbar-btn" disabled>
        <i nz-icon nzType="sort-ascending"></i> Sắp xếp
      </button>
    </div>
  </div>

  <!-- Table header (sticky) -->
  <div class="list-table-wrapper">
    <div class="list-header-row">
      <div class="col-expand"></div>
      <div class="col-title">Nhiệm vụ</div>
      <div class="col-assignee">Người thực hiện</div>
      <div class="col-due">Ngày hết hạn</div>
      <div class="col-checklist">Checklist</div>
    </div>

    <!-- Groups -->
    <div class="list-group" *ngFor="let list of board.lists; let gi = index">
      <!-- Group header -->
      <div class="group-header" (click)="toggleGroup(list.id)">
        <div class="group-header-left">
          <i nz-icon [nzType]="collapsedGroups.has(list.id) ? 'caret-right' : 'caret-down'"
            class="group-toggle-icon"></i>
          <span class="group-color-dot" [style.background]="getListColor(gi)"></span>
          <span class="group-name">{{ list.name }}</span>
          <span class="group-count">{{ list.cards?.length || 0 }}</span>
        </div>
      </div>

      <!-- Task rows -->
      <ng-container *ngIf="!collapsedGroups.has(list.id)">
        <div class="task-row" *ngFor="let card of list.cards; let last = last" [class.task-row-last]="last"
          (click)="cardClicked.emit(card)">

          <!-- Expand placeholder -->
          <div class="col-expand">
            <div class="task-status-dot" [class.done]="card.isCompleted"
              (click)="$event.stopPropagation(); cardToggleComplete.emit(card)" nz-tooltip
              [nzTooltipTitle]="card.isCompleted ? 'Hoàn thành' : 'Đang thực hiện'">
              <i nz-icon nzType="check"></i>
            </div>
          </div>

          <!-- Title -->
          <div class="col-title">
            <div class="task-title-wrap">
              <span class="task-title-text" [class.text-completed]="card.isCompleted">{{ card.title }}</span>
              <div class="task-labels" *ngIf="(card.labels || []).length > 0">
                <span *ngFor="let label of card.labels" class="task-label-chip" [style.background]="label.color + '33'"
                  [style.color]="label.color" nz-tooltip [nzTooltipTitle]="label.name">
                  {{ label.name }}
                </span>
              </div>
            </div>
          </div>

          <!-- Assignee -->
          <div class="col-assignee">
            <nz-avatar-group *ngIf="card.members?.length; else noAssignee">
              <span *ngFor="let m of (card.members || []).slice(0, 3)" nz-tooltip [nzTooltipTitle]="m.fullName || m.userId" class="member-avatar">
                <app-user-avatar
                  [userName]="m.userId"
                  [fullName]="m.fullName || m.userId"
                  [avatarFileId]="m.avatarFileId"
                  size="small" />
              </span>
              <nz-avatar *ngIf="(card.members || []).length > 3" nzSize="small"
                [nzText]="'+' + ((card.members || []).length - 3)" class="member-avatar member-avatar-more">
              </nz-avatar>
            </nz-avatar-group>
            <ng-template #noAssignee>
              <span class="no-value">—</span>
            </ng-template>
          </div>

          <!-- Due date -->
          <div class="col-due">
            <span *ngIf="card.dueDate; else noDue" class="due-badge" [class.overdue]="isOverdue(card.dueDate)"
              [class.due-soon]="isDueSoon(card.dueDate)">
              <i nz-icon nzType="clock-circle"></i>
              {{ formatDate(card.dueDate) }}
            </span>
            <ng-template #noDue><span class="no-value">—</span></ng-template>
          </div>

          <!-- Checklist -->
          <div class="col-checklist">
            <ng-container *ngIf="getChecklistProgress(card) as progress">
              <span *ngIf="progress.total > 0" class="checklist-progress"
                [class.done]="progress.done === progress.total">
                <i nz-icon nzType="check-square"></i>
                {{ progress.done }}/{{ progress.total }}
              </span>
            </ng-container>
          </div>
        </div>

        <!-- Add task row -->
        <div class="add-task-container">
          <div *ngIf="addingCardListId !== list.id" class="add-task-row" (click)="startAddCard(list.id)">
            <i nz-icon nzType="plus" class="add-task-icon"></i>
            <span class="add-task-text">Thêm nhiệm vụ</span>
          </div>
          <div *ngIf="addingCardListId === list.id" class="add-task-form">
            <input nz-input [id]="'new-card-input-lv-' + list.id" [(ngModel)]="newCardTitle"
              placeholder="Tiêu đề nhiệm vụ..." (keydown)="onKeydownCard($event, list)" />
            <div class="add-task-actions">
              <button nz-button nzType="primary" nzSize="small" (click)="submitAddCard(list)">Thêm</button>
              <button nz-button nzType="text" nzSize="small" (click)="cancelAddCard()">
                <i nz-icon nzType="close"></i>
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Add List Section -->
    <div class="add-list-section">
      <div *ngIf="!isAddingList" class="add-list-trigger" (click)="startAddList()">
        <i nz-icon nzType="plus"></i>
        <span>Thêm danh sách mới</span>
      </div>
      <div *ngIf="isAddingList" class="add-list-form">
        <input nz-input id="new-list-input-lv" [(ngModel)]="newListName" placeholder="Tên danh sách..."
          (keydown)="onKeydownList($event)" />
        <div class="add-list-actions">
          <button nz-button nzType="primary" nzSize="small" (click)="submitAddList()">Thêm</button>
          <button nz-button nzType="text" nzSize="small" (click)="cancelAddList()">
            <i nz-icon nzType="close"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

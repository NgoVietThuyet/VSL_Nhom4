<div class="weather-scene" [attr.data-scene]="scene">
  <div class="weather-scene__sky"></div>

  <div class="weather-scene__stars" *ngIf="showMoon()">
    <span class="star" *ngFor="let s of stars" [ngStyle]="starStyle(s)"></span>
  </div>

  <div class="weather-scene__sun" *ngIf="showSun()" aria-hidden="true"></div>
  <div class="weather-scene__moon" *ngIf="showMoon()" aria-hidden="true"></div>

  <div class="weather-scene__clouds" *ngIf="showClouds()">
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="cloud cloud--3"></div>
    <div class="cloud cloud--4" *ngIf="scene === 'cloudy' || scene === 'rain' || scene === 'heavy-rain' || scene === 'thunderstorm'"></div>
  </div>

  <div class="weather-scene__rain" *ngIf="showRain()" [class]="'intensity-' + rainIntensity()">
    <span class="drop" *ngFor="let d of rainDrops" [ngStyle]="dropStyle(d)"></span>
  </div>

  <div class="weather-scene__snow" *ngIf="showSnow()">
    <span class="flake" *ngFor="let f of snowFlakes" [ngStyle]="flakeStyle(f)"></span>
  </div>

  <div class="weather-scene__fog" *ngIf="showFog()"></div>
  <div class="weather-scene__lightning" *ngIf="showLightning()" aria-hidden="true"></div>

  <div class="weather-scene__vignette"></div>
</div>

<button
  nz-button
  nzType="default"
  nz-dropdown
  [nzDropdownMenu]="filterMenu"
  nzTrigger="click"
  [(nzVisible)]="visible"
  nzPlacement="bottomRight"
  nzOverlayClassName="task-list-filter-dropdown"
  [nzClickHide]="false"
  nz-tooltip
  nzTooltipTitle="Lọc nâng cao"
  [class.filter-btn-active]="visible">
  <nz-icon nzType="filter" nzTheme="outline" />
</button>

<nz-dropdown-menu #filterMenu="nzDropdownMenu">
  <div class="filter-dropdown-panel">
    <div class="filter-panel-header">
      <span class="filter-panel-title">
        <nz-icon nzType="filter" nzTheme="outline" /> Lọc nâng cao
      </span>
      <button nz-button nzType="text" nzSize="small" class="filter-panel-close" (click)="close()" aria-label="Đóng">
        <nz-icon nzType="close" nzTheme="outline" />
      </button>
    </div>

    <form nz-form nzLayout="vertical" class="filter-panel-form" *ngIf="mode === 'task'">
      <div nz-row [nzGutter]="16">
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Số/KH văn bản</nz-form-label>
            <nz-form-control>
              <input nz-input [(ngModel)]="colFilter['documentNumber']" name="fDocNum" placeholder="Nhập số/ký hiệu..." />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Nhóm chuyên đề</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['topicGroupId']" name="fTopic" nzAllowClear nzShowSearch nzPlaceHolder="Chọn nhóm chuyên đề">
                <nz-option *ngFor="let g of mainTasks" [nzValue]="g.id" [nzLabel]="g.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Độ ưu tiên</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['priorityLevelId']" name="fPriority" nzAllowClear nzPlaceHolder="Chọn ưu tiên">
                <nz-option *ngFor="let p of taskPriorities" [nzValue]="p.code" [nzLabel]="p.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Đơn vị ban hành</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['issuerOrganizationId']" name="fIssuer" nzAllowClear nzShowSearch nzPlaceHolder="Chọn đơn vị">
                <nz-option *ngFor="let o of organizes" [nzValue]="o.id" [nzLabel]="o.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Đơn vị phối hợp</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['coordinateOrganizationId']" name="fCoord" nzAllowClear nzShowSearch nzPlaceHolder="Chọn đơn vị">
                <nz-option *ngFor="let o of organizes" [nzValue]="o.id" [nzLabel]="o.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Lĩnh vực</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['fieldId']" name="fField" nzAllowClear nzPlaceHolder="Chọn lĩnh vực">
                <nz-option *ngFor="let f of documentFields" [nzValue]="f.code" [nzLabel]="f.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Thời hạn hoàn thành</nz-form-label>
            <nz-form-control>
              <nz-date-picker [(ngModel)]="colFilter['dueDate']" name="fDue" nzFormat="dd/MM/yyyy"
                nzPlaceHolder="Chọn ngày" style="width:100%"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Trạng thái thực hiện</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['filterTaskStatus']" name="fTaskStatus" nzAllowClear nzPlaceHolder="Chọn trạng thái">
                <nz-option *ngFor="let s of taskStatusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Trạng thái giao việc</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['filterAssignmentStatus']" name="fAsnStatus" nzAllowClear nzPlaceHolder="Chọn trạng thái">
                <nz-option *ngFor="let s of assignmentStatusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </form>

    <form nz-form nzLayout="vertical" class="filter-panel-form" *ngIf="mode === 'document'">
      <div nz-row [nzGutter]="16">
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Lĩnh vực</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['fieldId']" name="fdField" nzAllowClear nzPlaceHolder="Chọn lĩnh vực">
                <nz-option *ngFor="let f of documentFields" [nzValue]="f.code" [nzLabel]="f.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Độ khẩn</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['urgencyLevelId']" name="fdUrgency" nzAllowClear nzPlaceHolder="Chọn độ khẩn">
                <nz-option *ngFor="let u of urgencyLevels" [nzValue]="u.code" [nzLabel]="u.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Độ mật</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['confidentialityLevelId']" name="fdSecurity" nzAllowClear nzPlaceHolder="Chọn độ mật">
                <nz-option *ngFor="let s of securityLevels" [nzValue]="s.code" [nzLabel]="s.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Trạng thái xử lý</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="colFilter['filterProcessingStatus']" name="fdProcStatus" nzAllowClear nzPlaceHolder="Chọn trạng thái">
                <nz-option *ngFor="let s of documentStatusFilterOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Từ ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker [(ngModel)]="colFilter['fromDate']" name="fdFromDate" nzFormat="dd/MM/yyyy"
                nzPlaceHolder="Chọn ngày" style="width:100%"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label>Đến ngày</nz-form-label>
            <nz-form-control>
              <nz-date-picker [(ngModel)]="colFilter['toDate']" name="fdToDate" nzFormat="dd/MM/yyyy"
                nzPlaceHolder="Chọn ngày" style="width:100%"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </form>

    <div class="filter-panel-actions">
      <button nz-button (click)="onReset()">
        <nz-icon nzType="sync" nzTheme="outline" /> Xóa lọc
      </button>
      <button nz-button nzType="primary" (click)="onApply()">
        <nz-icon nzType="search" nzTheme="outline" /> Áp dụng
      </button>
    </div>
  </div>
</nz-dropdown-menu>

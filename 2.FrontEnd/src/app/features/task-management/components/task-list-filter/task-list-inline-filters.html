<div class="inline-filters" *ngIf="mode === 'task'">
  <input nz-input class="inline-filter-field inline-filter-field--wide"
    placeholder="Tìm kiếm nhanh..." [(ngModel)]="colFilter['keyword']"
    (keydown.enter)="onEnter()" />
  <nz-select class="inline-filter-field" nzAllowClear nzShowSearch nzPlaceHolder="Đơn vị chủ trì"
    [(ngModel)]="colFilter['leadOrganizationId']">
    <nz-option *ngFor="let o of organizes" [nzValue]="o.id" [nzLabel]="o.name"></nz-option>
  </nz-select>
</div>

<div class="inline-filters" *ngIf="mode === 'document'">
  <input nz-input class="inline-filter-field inline-filter-field--wide"
    placeholder="Tìm kiếm nhanh..." [ngModel]="keyWord"
    (ngModelChange)="onKeyWordChange($event)"
    (keydown)="onKeyWordKeydown($event)" />
  <nz-select class="inline-filter-field" nzAllowClear nzShowSearch nzPlaceHolder="Loại văn bản"
    [(ngModel)]="colFilter['documentTypeId']">
    <nz-option *ngFor="let t of documentTypes" [nzValue]="t.code" [nzLabel]="t.name"></nz-option>
  </nz-select>
</div>

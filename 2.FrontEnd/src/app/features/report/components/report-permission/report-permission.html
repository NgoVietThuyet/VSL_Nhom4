<nz-page-header nzBackIcon>
    <nz-page-header-title>PHÂN QUYỀN BÁO CÁO</nz-page-header-title>
    <nz-page-header-subtitle>Cấp quyền theo nhóm/người dùng cho từng loại báo cáo</nz-page-header-subtitle>
    <nz-page-header-extra>
        <nz-space>
            <nz-select *nzSpaceItem style="width:280px" [(ngModel)]="selectedDefinition" nzShowSearch nzAllowClear
                nzPlaceHolder="Chọn loại báo cáo" (ngModelChange)="load()">
                <nz-option *ngFor="let d of definitions" [nzValue]="d.id" [nzLabel]="d.name"></nz-option>
            </nz-select>
            <button *nzSpaceItem nz-button nzType="primary" (click)="open('', false)" [disabled]="!selectedDefinition">
                <nz-icon nzType="plus" /> Thêm
            </button>
        </nz-space>
    </nz-page-header-extra>
    <nz-page-header-content>
        <nz-table #plist nzBordered [nzData]="permissions" nzSize="small" [nzShowPagination]="false">
            <thead>
                <tr>
                    <th nzAlign="center" nzWidth="60px">STT</th>
                    <th>Nhóm tài khoản</th>
                    <th>Tài khoản</th>
                    <th nzAlign="center" nzWidth="80px">Xem</th>
                    <th nzAlign="center" nzWidth="80px">Sửa</th>
                    <th nzAlign="center" nzWidth="100px">Duyệt</th>
                    <th>Ghi chú</th>
                    <th nzAlign="center" nzWidth="120px">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of plist.data; let i = index">
                    <td nzAlign="center">{{i + 1}}</td>
                    <td><a (click)="open(item, true)">{{ item.accountGroupId }}</a></td>
                    <td>{{ item.accountId }}</td>
                    <td nzAlign="center"><nz-icon *ngIf="item.canView" nzType="check" /></td>
                    <td nzAlign="center"><nz-icon *ngIf="item.canEdit" nzType="check" /></td>
                    <td nzAlign="center"><nz-icon *ngIf="item.canApprove" nzType="check" /></td>
                    <td>{{ item.notes }}</td>
                    <td nzAlign="center">
                        <button nz-button nzType="link" nzDanger (click)="delete(item)">
                            <nz-icon nzType="delete" />
                        </button>
                    </td>
                </tr>
            </tbody>
        </nz-table>
    </nz-page-header-content>
</nz-page-header>

<nz-drawer [nzWidth]="500" [nzClosable]="false" [nzVisible]="visible" nzPlacement="right" [nzExtra]="extra"
    [nzTitle]="isEdit ? 'CHỈNH SỬA QUYỀN' : 'THÊM QUYỀN'" (nzOnClose)="close()">
    <ng-container *nzDrawerContent>
        <label>Nhóm tài khoản</label>
        <nz-select class="space-control" style="width:100%" [(ngModel)]="dto.accountGroupId" nzShowSearch nzAllowClear>
            <nz-option *ngFor="let g of accountGroups" [nzValue]="g.id" [nzLabel]="g.name"></nz-option>
        </nz-select>
        <label>Tài khoản (riêng)</label>
        <nz-select class="space-control" style="width:100%" [(ngModel)]="dto.accountId" nzShowSearch nzAllowClear>
            <nz-option *ngFor="let a of accounts" [nzValue]="a.id" [nzLabel]="a.fullName || a.userName || a.id"></nz-option>
        </nz-select>
        <div style="margin: 12px 0;">
            <nz-switch [(ngModel)]="dto.canView"></nz-switch> <span style="margin-left:8px">Cho phép xem</span>
        </div>
        <div style="margin: 12px 0;">
            <nz-switch [(ngModel)]="dto.canEdit"></nz-switch> <span style="margin-left:8px">Cho phép nhập/sửa</span>
        </div>
        <div style="margin: 12px 0;">
            <nz-switch [(ngModel)]="dto.canApprove"></nz-switch> <span style="margin-left:8px">Cho phép duyệt</span>
        </div>
        <label>Ghi chú</label>
        <textarea nz-input [(ngModel)]="dto.notes" rows="2" class="space-control"></textarea>
    </ng-container>
    <ng-template #extra>
        <nz-space>
            <button *nzSpaceItem nz-button nzType="primary" class="btn-green" (click)="save()">
                <nz-icon nzType="save" /> {{isEdit ? 'Cập nhật' : 'Lưu'}}
            </button>
            <button *nzSpaceItem nz-button nzType="primary" nzDanger (click)="close()">
                <nz-icon nzType="close" />
            </button>
        </nz-space>
    </ng-template>
</nz-drawer>
